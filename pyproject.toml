[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epik8s-pyioc"
version = "0.2.0"
description = "Specification and runtime for containerized Python EPICS IOCs configured from epik8s values.yaml"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pyioc = "epik8s_pyioc.cli:main"
pyioc-run = "epik8s_pyioc.runner:main_run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epik8s_pyioc = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
