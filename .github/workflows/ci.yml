name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Generated projects need iocmng 2.8.0 or later (driver source, asyncio dispatcher).
  IOCMNG: "iocmng>=2.8.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]' caproto numpy
      - run: pytest -q
      # a generated project must install and pass its own Channel Access tests
      - name: Generated project end to end
        run: |
          cd "$RUNNER_TEMP"
          pyioc init ci-demo
          pip install "$IOCMNG"
          # --no-deps: epik8s-pyioc is the checkout installed above, not the release tag
          pip install --no-deps -e ci-demo
          cd ci-demo && pytest -q
